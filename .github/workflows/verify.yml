name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS demo and Deep Links
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 1
      LYNX_CAPACITOR_USE_PUBLISHED: true
      SIMULATOR: iPhone 16 Pro
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen and Ruby dependencies
        run: |
          brew install xcodegen
          cd ios/Demo
          bundle install

      - name: Build and test iOS demo
        run: bash scripts/ios-test.sh
